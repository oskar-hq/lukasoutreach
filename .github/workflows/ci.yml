# Prüft bei jedem Pull Request beide Seiten – so merkt jeder Agent sofort, wenn seine Änderung die andere Seite bricht.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Typprüfung + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run verify:backend

  frontend:
    name: Frontend · Typprüfung, Build, E2E (gegen Mock-Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # Die E2E-Tests starten das Backend im Mock-Modus
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ergebnisse
          path: test-results/
          retention-days: 7
